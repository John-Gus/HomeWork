<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="sale">
      <div></div>
      <div class="sale__content">
        <p class="sale__text">
          Зарегестрируйтесь и получите скидку 20% на первую покупку.
        </p>
        <a href="#" class="sale__content-link">Зарегистророваться сейчас</a>
      </div>
      <img
        class="sale__img"
        src="./icons/cross.svg"
        width="20"
        height="20"
        alt="Закрыть"
      />
    </div>

    <header class="header">
      <div class="header__menu container">
        <a href="/" class="header__logo">
          <img
            class="logo__img"
            src="./icons/logo-icon.svg"
            width="160"
            height="22"
            alt="Логотип SHOP.CO"
          />
        </a>
        <nav class="header__menu-nav">
          <ul class="header__menu-list">
            <li class="header__menu-list-item">Магазиг</li>
            <li class="header__menu-list-item">Скидки</li>
            <li class="header__menu-list-item">Новые поступления</li>
            <li class="header__menu-list-item">Бренды</li>
          </ul>
        </nav>
        <form class="header__search-form">
          <button class="header__search-button">
            <img
              class="header__search-icon"
              src="./icons/search.svg"
              width="24"
              height="24"
              alt="Поиск по странице"
            />
          </button>
          <input
            class="header__search-txt"
            type="text"
            placeholder="Искать товары..."
          />
        </form>

                <div class="header__controls">
          <div class="header__actions">
            <button
              class="header__actions-button"
              title="Корзина"
              aria-label="Корзина"
            >
              <svg width="24" height="24">
                <use class="header__actions-icon" href="./icons/cart.svg"></use>
              </svg>
            </button>
            <button
              class="header__actions-button"
              title="Аккаунт"
              aria-label="Аккаунт"
            >
              <svg width="24" height="24">
                <use
                  class="header__actions-icon"
                  href="./icons/account.svg"
                ></use>
              </svg>
            </button>
          </div>
      </div>
    </header>
  </body>
</html>
