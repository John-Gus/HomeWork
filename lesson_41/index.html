<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика по формам</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <h1>Практика по формам</h1>
    <form class="form">
        <h2 class="form-group-title">Ваши личные данные</h2>
        <fieldset class="form-group">
            <label>
                Ваше имя
                <input class="input" type="text" name="name" placeholder="Имя" required>
            </label>
            <label>
                Ваш возраст
                <input class="input" type="number" name="age" placeholder="Возраст" required>
            </label>
            <label>
                Номер телефона
                <input class="input" type="tel" name="phone" placeholder="Номер телефона" required>
            </label>
            <label>
                Ваша почта
                <input class="input" type="email" name="email" placeholder="Почта" required>
            </label>
        </fieldset>
        <fieldset class="form-group">
            <label> Сообщение
                <textarea class="textarea" name="message" placeholder="Ваше сообщение"></textarea>
            </label>
            <input type="checkbox" class="checkbox" required>
            Я принимаю правила
        </fieldset>
        <button class="button">Отправить</button>
    </form>
</body>

</html>
